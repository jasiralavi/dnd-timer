name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -q DND-Timer-Android-Source-v1.3.0.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore protected signing key
        env:
          DND_KEYSTORE_BASE64: ${{ secrets.DND_KEYSTORE_BASE64 }}
        run: |
          test -n "$DND_KEYSTORE_BASE64"
          mkdir -p signing
          printf '%s' "$DND_KEYSTORE_BASE64" | base64 --decode > signing/dsynz-dnd-timer-release.p12

      - name: Build signed release APK and AAB
        working-directory: dnd-timer
        env:
          DND_KEYSTORE_PATH: ../../signing/dsynz-dnd-timer-release.p12
          DND_KEYSTORE_PASSWORD: ${{ secrets.DND_KEYSTORE_PASSWORD }}
          DND_KEY_ALIAS: dndtimer
          DND_KEY_PASSWORD: ${{ secrets.DND_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Prepare release files
        run: |
          cp dnd-timer/app/build/outputs/apk/release/app-release.apk DND-Timer-v1.3.0-release.apk
          cp dnd-timer/app/build/outputs/bundle/release/app-release.aab DND-Timer-v1.3.0-release.aab

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: DND-Timer-v1.3.0-Release
          path: |
            DND-Timer-v1.3.0-release.apk
            DND-Timer-v1.3.0-release.aab
          if-no-files-found: error
          retention-days: 30
